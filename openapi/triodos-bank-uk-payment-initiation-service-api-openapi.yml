  /{tenant}/v1/bulk-payments/sepa-credit-transfers:
    post:
      tags:
      - Payment Initiation Service
      summary: Initiate Sepa Bulk Payment
      description: Creates a Sepa bulk payment initiation request and corresponding authorisation sub-resource.
      operationId: initiateSepaBulkPayment
      parameters:
      - name: X-Request-ID
        in: header
        description: ID of the request, unique to the call, as determined by the initiating party.
        required: true
        schema:
          type: string
      - name: tenant
        in: path
        description: Branch of the request.
        required: true
        schema:
          type: string
          enum:
          - uk
          - nl
          - be_fr
          - be_nl
      - name: Signature
        in: header
        description: A signature of the request by the TPP on application level.
        required: true
        schema:
          type: string
      - name: Digest
        in: header
        description: Digest contains a Hash of the message body, used for authentication of the request. The only hash algorithms that may be used to calculate the Digest within the context of this specification are SHA-256 and SHA-512.
        required: true
        schema:
          type: string
      - name: PSU-IP-Address
        in: header
        description: The forwarded IP Address header field consists of the corresponding HTTP request IP Address field between PSU and TPP.
        required: true
        schema:
          type: string
      - name: TPP-Redirect-URI
        in: header
        description: URI of the TPP, where the transaction flow shall be redirected to after a Redirect.
        required: true
        schema:
          type: string
      - name: Consent-ID
        in: header
        description: Must be empty, sessions are not supported.
        schema:
          type: string
      - name: TPP-Signature-Certificate
        in: header
        description: The certificate used for signing the request, in base64 encoding.
        required: true
        schema:
          type: string
      requestBody:
        description: PAIN.001.001.03 or PAIN.001.001.09 formatted bulk payment request.
        content:
          text/xml:
            schema:
              type: string
          application/xml:
            schema:
              type: string
        required: true
      responses:
        '201':
          description: Payment initiated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Xs2aPaymentRequestResponse'
        '400':
          description: Missing or invalid body (e.g. invalid IBAN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppMessages'
        '403':
          description: The addressed payment product is not available for the PSU
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppMessages'
        '404':
          description: No product found for given IBAN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TppMessages'
