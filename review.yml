aid: triodos-bank-uk
name: Triodos Bank UK
review:
  question: >-
    Does Triodos Bank UK expose a real, documented public API surface, and does
    it implement the OBIE UK Read/Write standard or the Berlin Group XS2A
    standard? Is a public OBIE Open Data (ATM/branch/product) endpoint confirmed?
  answer: true
  date: '2026-07-23'
  reviewer: API Evangelist
findings:
  summary: |
    Triodos Bank UK Ltd operates a real, live developer portal at
    developer.triodos.com ("Triodos Bank XS2A service", HTTP 200) covering its
    UK, Netherlands, and Belgium account holders. Triodos is an FCA/PRA
    authorised ASPSP (FRN 817008) but is NOT one of the CMA9; as a specialist,
    values-based lender it satisfies its PSD2 access-to-account obligation using
    the Berlin Group NextGenPSD2 (XS2A) standard - NOT the OBIE UK Read/Write
    standard. Two real OpenAPI 3.0.1 documents are published and were harvested
    verbatim: the XS2A BG service spec (63 paths; tags Account Information
    Service, Payment Initiation Service, Confirmation of Funds Service, Extended
    Account Information Service, Initial Access Token Service) and the Auth
    service spec (OAuth2/OpenID Connect: client registration, configuration,
    authorization, token, token revocation, UserInfo). These are
    bank-proprietary contracts conformant to the Berlin Group standard, not the
    shared OBIE spec. Production API version reported by
    https://api.triodos.com/xs2a-bg/version is 26.30.01 (OpenAPI info.version
    1.1). Authentication is FAPI-style: OAuth2/OIDC authorization, mutual-TLS
    client authentication with eIDAS/QWAC certificates, and PSD2 strong customer
    authentication (SCA). No public, unauthenticated OBIE Open Data endpoint
    (ATMs/branches/PCA/BCA) was confirmed for Triodos - guessed OBIE Open Data
    hosts on triodos.co.uk and api.triodos.co.uk returned 404/no-connection,
    consistent with Triodos not being a CMA9 bank subject to the Open Data remedy.
  standard: Berlin Group NextGenPSD2 (XS2A)
  isCMA9: false
  obieReadWriteConformance: false
  openDataConfirmed: false
  openDataBaseURL: ''
  specProvenance: >-
    Bank-proprietary OpenAPI contracts conformant to the Berlin Group
    NextGenPSD2 standard (Triodos XS2A BG service v1.1 + Triodos Auth service
    v1.0), not the shared OBIE Read/Write or OBIE Open Data specifications.
  transports:
    - protocol: REST
      scheme: https
      baseURL: https://api-ma.triodos.com/xs2a-bg
      documented: true
      note: >-
        Production mutual-TLS (QWAC/eIDAS) endpoint for AIS, PIS, and CoF
        resource calls.
    - protocol: REST
      scheme: https
      baseURL: https://api.triodos.com/auth
      documented: true
      note: >-
        Production OAuth2/OpenID Connect authorization, token, and registration
        endpoints (client-initiated, non-mTLS host api.triodos.com).
    - protocol: REST
      scheme: https
      baseURL: https://xs2a-sandbox.triodos.com/xs2a-bg
      documented: true
      note: Sandbox test environment (OpenAPI server URL) for onboarding and testing.
  authentication:
    - OAuth2 / OpenID Connect authorization
    - Mutual-TLS client authentication (eIDAS / QWAC certificates)
    - PSD2 Strong Customer Authentication (SCA)
    - Dynamic client registration
  endpointsConfirmed:
    - GET  https://api.triodos.com/xs2a-bg/version  (returns 26.30.01)
    - GET  https://api.triodos.com/xs2a-bg/openapi.json  (200, OpenAPI 3.0.1)
    - GET  https://api.triodos.com/auth/openapi.json  (200, OpenAPI 3.0.1)
    - GET  https://xs2a-sandbox.triodos.com/xs2a-bg/openapi.json  (200)
    - GET  https://xs2a-sandbox.triodos.com/auth/openapi.json  (200)
