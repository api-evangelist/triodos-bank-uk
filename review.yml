actions:
  openapiHarvested: true
  openapiPaths:
    - openapi/triodos-bank-uk-xs2a-openapi.json
    - openapi/triodos-bank-uk-auth-openapi.json
  apisYmlUpdated: true
  reason: >-
    Captured Triodos Bank UK identity plus its real XS2A developer surface. Both
    published OpenAPI 3.0.1 specs were harvested verbatim and represented as four
    apis[] entries (AIS, PIS, CoF, and the OAuth2/OIDC Authorization service).
    OBIE Open Data and OBIE Read/Write were deliberately NOT fabricated because
    Triodos is not a CMA9 bank and uses the Berlin Group XS2A standard; no live
    Open Data endpoint could be confirmed.
