name: Triodos Bank UK
kind: company
description: >-
  Triodos Bank UK Limited is a values-based, sustainability-focused bank
  headquartered in Bristol, England, and the UK arm of Triodos Bank N.V. (founded
  1980, Netherlands), one of Europe's leading ethical banks. Ownership of the
  parent sits with the SAAT foundation (Stichting Administratiekantoor Aandelen
  Triodos Bank), which issues depositary receipts rather than tradable shares, so
  Triodos is neither a conventional listed plc nor a customer mutual; it is a
  certified B Corporation that lends only to organisations delivering positive
  social, environmental, and cultural impact. Triodos Bank UK Ltd (company no.
  11379025) is authorised by the Prudential Regulation Authority and regulated by
  the Financial Conduct Authority and PRA (FRN 817008). As an FCA-authorised
  ASPSP it meets UK Open Banking / PSD2 obligations, but - unlike the CMA9 - it
  is a specialist lender that implements the Berlin Group NextGenPSD2 (XS2A)
  standard rather than the OBIE UK Read/Write standard, publishing a single
  developer platform at developer.triodos.com covering its UK, Netherlands, and
  Belgium account holders. Its production XS2A APIs provide Account Information
  (AIS), Payment Initiation (PIS), and Confirmation of Funds (CoF) services,
  secured with OAuth2/OpenID Connect authorization, mutual-TLS client
  authentication, eIDAS/QWAC certificates, and PSD2 strong customer
  authentication, with a full sandbox for onboarding and testing.
