http_statuses:
- status: 400
  meaning: Format / consistency error (e.g. ConsentID invalid, AccountID invalid).
- status: 401
  meaning: TLS certificate missing/invalid or invalid organizationIdentifier; token missing/invalid.
- status: 403
  meaning: Consent/resource not found for this TPP, or insufficient privileges.
- status: 404
  meaning: Addressed resource (AccountID, resource-id) not found.
- status: 429
  meaning: Too many requests - exceeds the consent FrequencyPerDay or parallel-request limit (TooManyRequests).
- status: 501
  meaning: Requested function not supported / not implemented.
